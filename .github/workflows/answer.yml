name: answer
# A change request from the reviewer bot, or a failed CI run, on an agent PR goes back to the fleet's worker
# lane, which lives in fleet-ops. The stub needs its own trigger, because "the github
# context is always associated with the caller workflow":
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
on:
  pull_request_review:
    types: [submitted]
  # A red CI run on an agent PR starts the lane too. The stub forwards every completed CI
  # run, and the called workflow picks the red ones: its dispatch job runs for a
  # pull_request CI run with conclusion 'failure' on an agent/issue-* branch of this repo,
  # and it reads the PR number from
  # github.event.workflow_run.pull_requests[0].number. The name is the CI workflow's own
  # name (name: ci in .github/workflows/ci.yml), so a rename there would stop this trigger
  # silently.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
  workflow_run: # zizmor: ignore[dangerous-triggers] nothing from the pull request is checked out or run
    workflows: [ci]
    types: [completed]
permissions: {}
jobs:
  answer:
    # The lane's job dispatches agent.yml on main with the issue and the PR. A called
    # workflow can only lower the caller's GITHUB_TOKEN permissions, never raise them.
    permissions: {actions: write}
    # @main, not a SHA, the same as the agent stub.
    # The stub passes no input: the called workflow declares none, and an input it does not
    # declare fails the run.
    uses: Nishfleet/fleet-ops/.github/workflows/answer.yml@main
