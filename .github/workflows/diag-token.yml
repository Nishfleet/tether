name: diag-token
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to probe'
        required: false
        default: '43'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - name: probe
        run: |
          set +e
          pr="${{ inputs.pr }}"
          sha=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "repo=$GITHUB_REPOSITORY pr=$pr sha=$sha"
          echo "--- 1. gh pr view --json statusCheckRollup (list job shape) ---"
          gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,statusCheckRollup >/tmp/1.json 2>/tmp/1.err
          echo "exit=$?"; head -c 400 /tmp/1.err; echo
          echo "--- 2. gh pr checks --required --json name,bucket (stuck-prs job shape) ---"
          gh pr checks --required --json name,bucket >/tmp/2.json 2>/tmp/2.err
          echo "exit=$?"; head -c 400 /tmp/2.err; echo
          echo "--- 3. REST check-runs ---"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" >/dev/null 2>/tmp/3.err
          echo "exit=$?"; head -c 400 /tmp/3.err; echo
          echo "--- 4. REST statuses ---"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" >/dev/null 2>/tmp/4.err
          echo "exit=$?"; head -c 400 /tmp/4.err; echo
          echo "--- 5. REST issue comments ---"
          gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=1" >/dev/null 2>/tmp/5.err
          echo "exit=$?"; head -c 400 /tmp/5.err; echo
          echo "--- 6. raw graphql statusCheckRollup ---"
          gh api graphql -f query='
            query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                pullRequest(number:$n){ commits(last:1){ nodes { commit { oid statusCheckRollup { contexts(first:100){ nodes { __typename } } } } } } }
              }
            }' -f o="$GITHUB_REPOSITORY_OWNER" -f r="$GITHUB_REPOSITORY" -F n="$pr" >/tmp/6.json 2>/tmp/6.err
          echo "exit=$?"; head -c 600 /tmp/6.err; echo
          echo "--- done ---"
