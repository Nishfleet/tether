name: diag-token
on:
  push:
    branches: ['diag/**']
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to probe'
        required: false
        default: '43'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "--- exact list/red loop command, per claim PR ---"
          all=$(gh pr list -R "$GITHUB_REPOSITORY" -L 1000 --json number,headRefName,autoMergeRequest,isDraft,isCrossRepository,mergeable,labels \
            --jq '[.[] | select((.headRefName|startswith("claim/issue-")) and (.isDraft|not))]')
          echo "$all" | jq -c '.[]|{number,headRefName,isCrossRepository,armed:(.autoMergeRequest!=null)}'
          for pr in $(jq -r '.[].number' <<<"$all"); do
            echo "=== PR $pr ==="
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,statusCheckRollup,mergeStateStatus >/tmp/a.json 2>/tmp/a.err
            echo "  list-loop exit=$?"; head -c 300 /tmp/a.err | sed 's/^/  ERR: /'
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,mergeStateStatus >/tmp/b.json 2>/tmp/b.err
            echo "  merge-only exit=$?"; head -c 300 /tmp/b.err | sed 's/^/  ERR: /'
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,statusCheckRollup >/tmp/c.json 2>/tmp/c.err
            echo "  rollup-only exit=$?"; head -c 300 /tmp/c.err | sed 's/^/  ERR: /'
            gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json mergeStateStatus >/tmp/d.json 2>/tmp/d.err
            echo "  merge-alone exit=$?"; head -c 300 /tmp/d.err | sed 's/^/  ERR: /'
          done
          echo "--- done ---"
