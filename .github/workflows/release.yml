name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage production files
        run: |
          mkdir stage
          cp -r dist package.json package-lock.json stage/
          npm ci --omit=dev --ignore-scripts --prefix stage
      - name: Pack deterministic tarball
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' -cf - -C stage . | gzip -n > "tether-$TAG.tar.gz"
          sha256sum "tether-$TAG.tar.gz" > "tether-$TAG.tar.gz.sha256"
          cat "tether-$TAG.tar.gz.sha256"
      - name: Smoke-test the tarball
        run: |
          smoke="$(mktemp -d)"
          tar -xzf "tether-$TAG.tar.gz" -C "$smoke"
          cd "$smoke"
          for f in dist/*.js; do
            node --check "$f"
            [ "$f" = dist/index.js ] || node --input-type=module -e 'await import(process.argv[1])' "$PWD/$f"
          done
          test "$(node dist/index.js --version)" = "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            tether-*.tar.gz
            tether-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Verify checksum
        run: sha256sum --check "tether-$TAG.tar.gz.sha256"
      - name: Create release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release exists, delete it to rebuild" >&2
            exit 1
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "tether-$TAG.tar.gz" "tether-$TAG.tar.gz.sha256" \
            "${flags[@]}" --verify-tag --title "$TAG" \
            --notes "Built by the release workflow from tag $TAG. Verify with sha256sum --check tether-$TAG.tar.gz.sha256."
